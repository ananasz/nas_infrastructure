theme: auto

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

identity_validation:
  reset_password: {}

authentication_backend:
  file:
    path: '/data/users_database.yml'

access_control:
  default_policy: one_factor
  rules:
    - domain: 'auth.ananasz.hu'
      policy: one_factor
    - domain: 'cetli.ananasz.hu'
      policy: one_factor

session:
  cookies:
    - domain: 'ananasz.hu'
      name: 'authelia_session'
      authelia_url: 'https://auth.ananasz.hu'
      default_redirection_url: 'https://cetli.ananasz.hu'
      same_site: 'lax'
      inactivity: '30m'
      expiration: '8h'
      remember_me: '2M'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

identity_providers:
  oidc:
    jwks:
      - key_id: 'ananasz-nas-main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/run/secrets/authelia_oidc_jwks_private_key" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'cetli-backend'
        client_name: 'Cetli Backend'
        client_secret: {{ secret "/run/secrets/authelia_cetli_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        token_endpoint_auth_method: 'client_secret_post'
        redirect_uris:
          - 'https://api.cetli.ananasz.hu/auth/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
      - client_id: 'anachronos-backend'
        client_name: 'anaChronos'
        client_secret: {{ secret "/run/secrets/authelia_anachronos_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        token_endpoint_auth_method: 'client_secret_post'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://chrono.ananasz.hu/api/auth/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
