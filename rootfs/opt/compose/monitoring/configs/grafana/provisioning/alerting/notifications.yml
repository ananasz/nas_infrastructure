apiVersion: 1

# Every alert rule goes to e-mail; the rules themselves are not provisioned yet (docs/PLANS.md).
contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: nas-email
        type: email
        settings:
          addresses: $ALERT_EMAIL
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: ['grafana_folder', 'alertname']
