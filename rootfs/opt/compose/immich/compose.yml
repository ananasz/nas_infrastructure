# Based on the official Immich v3 docker-compose.yml; keep in sync on major upgrades:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
name: immich
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'
x-db-env: &db-env
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in immich/.env}
  DB_USERNAME: postgres
  DB_DATABASE_NAME: immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    environment:
      <<: *db-env
      TZ: Europe/Budapest
    volumes:
      # Originals, encoded videos and Immich's own DB dumps on the ZFS pool.
      - photos:/data
      # Regenerable thumbnails on the SSD.
      - immich-thumbs:/data/thumbs
      - /etc/localtime:/etc/localtime:ro
    # Quick Sync / VAAPI transcoding on the iGPU.
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      - redis
      - database
    networks:
      - default
      - nas-bridge
    restart: always
    healthcheck:
      disable: false
    logging: *logging

  immich-machine-learning:
    container_name: immich_machine_learning
    # OpenVINO build for the Intel iGPU.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}-openvino
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - immich-model-cache:/cache
    restart: always
    healthcheck:
      disable: false
    logging: *logging

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
    logging: *logging

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in immich/.env}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich-postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    logging: *logging

volumes:
  # Photo library on the ZFS pool; create the directory before the first start.
  photos:
    driver: local
    driver_opts: {type: none, o: bind, device: /nas-data/zfs-pool/photos}
  immich-thumbs:
    name: immich-thumbs
  immich-model-cache:
    name: immich-model-cache
  immich-postgres:
    name: immich-postgres

networks:
  nas-bridge:
    external: true
