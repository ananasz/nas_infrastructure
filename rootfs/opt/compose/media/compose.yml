name: media
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'
x-linuxserver: &linuxserver
  restart: always
  networks:
    - nas-bridge
  logging: *logging
services:
  jellyfin:
    <<: *linuxserver
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1001
      - PGID=1001
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    group_add:
      - '105' # render group of /dev/dri/renderD128
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - media:/media
  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1001
      - PGID=1001
    volumes:
      - radarr-config:/config
      - media:/media
    depends_on: [prowlarr, qbittorrent, jellyfin]
  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1001
      - PGID=1001
    volumes:
      - sonarr-config:/config
      - media:/media
    depends_on: [prowlarr, qbittorrent, jellyfin]
  bazarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1001
      - PGID=1001
    volumes:
      - bazarr-config:/config
      - media:/media
    depends_on: [sonarr, radarr]
  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1001
      - PGID=1001
      - WEBUI_PORT=8110
      - TORRENTING_PORT=51347
    volumes:
      - qbittorrent-config:/config
      - media:/media
      - incomplete:/incomplete
    ports:
      - 51347:51347
      - 51347:51347/udp
  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1001
      - PGID=1001
    volumes:
      - prowlarr-config:/config
  jellyseerr:
    <<: *linuxserver
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Europe/Budapest
    volumes:
      - jellyseerr-config:/app/config
      - media:/media
    depends_on: [sonarr, radarr]
volumes:
  jellyfin-config: {external: true, name: jellyfin-config}
  jellyfin-cache: {external: true, name: jellyfin-cache}
  radarr-config: {external: true, name: radarr-config}
  sonarr-config: {external: true, name: sonarr-config}
  bazarr-config: {external: true, name: bazarr-config}
  qbittorrent-config: {external: true, name: qbittorrent-config}
  prowlarr-config: {external: true, name: prowlarr-config}
  jellyseerr-config: {external: true, name: jellyseerr-config}
  # Media data stays on the ZFS pool; these paths must not move.
  media:
    driver: local
    driver_opts: {type: none, o: bind, device: /nas-data/zfs-pool/media}
  incomplete:
    driver: local
    driver_opts: {type: none, o: bind, device: /nas-data/zfs-pool/incomplete}
networks:
  nas-bridge:
    external: true
