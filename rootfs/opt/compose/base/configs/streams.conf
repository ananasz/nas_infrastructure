# Database access for LAN/WireGuard clients: nginx terminates TLS on 5432 and picks the
# database by SNI. Clients need direct TLS negotiation (PostgreSQL 17+ / sslnegotiation=direct).
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_server_name $db_target {
        anachronos-db.nas anachronos-db:5432;
    }

    server {
        listen 5432 ssl;
        include /etc/nginx/snippets/lan-allow.conf;
        include /etc/nginx/snippets/internal-tls.conf;
        ssl_alpn postgresql;
        proxy_pass $db_target;
    }
}
