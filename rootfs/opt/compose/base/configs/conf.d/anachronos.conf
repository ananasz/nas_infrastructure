# anaChronos; the web container serves the SPA and proxies /api to the backend.
server {
	listen 443 ssl;
	http2 on;
	server_name chrono.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/chrono.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chrono.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	client_max_body_size 25m;

	location / {
		set $upstream anachronos-web:8080;
		include /etc/nginx/snippets/proxy.conf;
		# /api/events is SSE with a 25 s heartbeat: no buffering, timeout above the heartbeat.
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 75s;
		proxy_pass http://$upstream;
	}
}
