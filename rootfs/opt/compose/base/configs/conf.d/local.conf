# LAN/WireGuard-only HTTP vhosts. The router's DNS resolves *.nas to this host.

server {
	listen 80;
	server_name fin.nas;
	include /etc/nginx/snippets/lan-allow.conf;

	location / {
		set $upstream jellyfin:8096;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}
}

