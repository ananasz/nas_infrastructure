server {
	listen 443 ssl;
	http2 on;
	server_name cetli.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/cetli.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cetli.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	# The frontend image serves the SPA including its index.html fallback.
	location / {
		set $upstream cetli-frontend:80;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name api.cetli.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/cetli.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cetli.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	# Preserve backend-set cookie attributes (SameSite/Secure/HttpOnly).
	proxy_cookie_path / "/";

	location / {
		set $upstream cetli-backend:3000;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}

	# Long-polling changes feed
	location /db/ {
		set $upstream cetli-backend:3000;
		include /etc/nginx/snippets/proxy.conf;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
		proxy_buffering off;
		proxy_pass http://$upstream;
	}

	# Android App Links file, shipped in the frontend image.
	location = /.well-known/assetlinks.json {
		set $upstream cetli-frontend:80;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
		proxy_hide_header Content-Type;
		proxy_hide_header Cache-Control;
		add_header Content-Type application/json always;
		add_header Cache-Control "public, max-age=300" always;
		include /etc/nginx/snippets/security-headers.conf;
		access_log off;
	}
}
