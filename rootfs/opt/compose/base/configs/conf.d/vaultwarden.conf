# Vaultwarden; public for the mobile and desktop clients, DNS only (docs/CLOUDFLARE.md).
server {
	listen 443 ssl;
	http2 on;
	server_name vw.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/vw.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/vw.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	# Attachments up to Bitwarden's 500 MB limit.
	client_max_body_size 525m;

	set $upstream vaultwarden:80;

	# Includes the /notifications/hub WebSocket (proxy.conf sets the Upgrade headers).
	location / {
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}

	location /admin {
		include /etc/nginx/snippets/lan-allow.conf;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}
}
