# npm registry (Verdaccio)
server {
	listen 443 ssl;
	http2 on;
	server_name registry.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/registry.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/registry.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	location / {
		set $upstream verdaccio:4873;
		include /etc/nginx/snippets/proxy.conf;
		proxy_request_buffering off;
		client_max_body_size 100m;
		proxy_pass http://$upstream;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name auth.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/auth.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/auth.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	set $upstream authelia:9091;

	location / {
		include /etc/nginx/snippets/proxy.conf;
		proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
		proxy_set_header X-Forwarded-URI $request_uri;
		proxy_set_header X-Forwarded-Ssl on;
		proxy_pass http://$upstream;
	}

	location = /api/verify {
		proxy_pass http://$upstream;
	}

	location /api/authz/ {
		proxy_pass http://$upstream;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name qb.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/qb.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/qb.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;
	# The previous config had "allow" without "deny all", which did not restrict anything.
	include /etc/nginx/snippets/lan-allow.conf;

	location / {
		set $upstream qbittorrent:8110;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}
}

# Docker registry: login required, and only from the LAN/WireGuard.
server {
	listen 443 ssl;
	http2 on;
	server_name docker.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/docker.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/docker.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/lan-allow.conf;

	# docker login; the internal registry UI and retention job bypass nginx.
	auth_basic "Docker registry";
	auth_basic_user_file /run/secrets/registry_htpasswd;
	add_header Docker-Distribution-Api-Version registry/2.0 always;

	client_max_body_size 0;
	proxy_request_buffering off;
	proxy_read_timeout 900;
	proxy_send_timeout 900;

	location / {
		set $upstream registry:5000;
		include /etc/nginx/snippets/proxy.conf;
		proxy_pass http://$upstream;
	}
}

# Immich; the Cloudflare proxy would cap uploads at 100 MB, keep this record DNS-only.
server {
	listen 443 ssl;
	http2 on;
	server_name photos.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/photos.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/photos.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	client_max_body_size 50000M;
	client_body_buffer_size 1024k;
	proxy_request_buffering off;
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;
	send_timeout 600s;

	location / {
		set $upstream immich_server:2283;
		include /etc/nginx/snippets/proxy.conf;
		proxy_redirect off;
		proxy_pass http://$upstream;
	}
}
