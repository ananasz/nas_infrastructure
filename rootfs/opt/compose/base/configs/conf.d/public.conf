server {
	listen 443 ssl;
	http2 on;
	server_name fs.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/fs.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/fs.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;
	add_header Cache-Control public;
	add_header Vary Accept-Encoding;

	root /usr/share/nginx/served;

	location / {
		autoindex off;
	}

	location /indexed {
		autoindex on;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name fin.ananasz.hu;
	ssl_certificate /etc/letsencrypt/live/fin.ananasz.hu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/fin.ananasz.hu/privkey.pem;
	include /etc/nginx/snippets/security-headers.conf;

	location / {
		set $upstream jellyfin:8096;
		include /etc/nginx/snippets/proxy.conf;
		proxy_buffering off;
		proxy_pass http://$upstream;
	}
}

