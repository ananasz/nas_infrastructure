user  nginx;
worker_processes  auto;

error_log /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

include /etc/nginx/streams.conf;

http {
	# Resolve container names at request time; a stopped upstream must not block startup.
	resolver 127.0.0.11 valid=10s ipv6=off;
	include /etc/nginx/snippets/cloudflare-real-ip.conf;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
	server_tokens off;
	client_max_body_size 500M;
	client_body_buffer_size 128M;

    log_format main escape=json
      '{"time":"$time_iso8601","host":"$host","ip":"$remote_addr",'
      '"method":"$request_method","uri":"$uri","status":$status,'
      '"request_id":"$request_id","request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status","bytes_sent":$body_bytes_sent,'
      '"agent":"$http_user_agent"}';

    # Docker rotates stdout/stderr; Alloy forwards them to Loki.
    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout  65;

	gzip on;
	gzip_comp_level 5;
	gzip_disable "msie6";
	gzip_http_version 1.1;
	gzip_vary on;

	gzip_proxied any;
	gzip_buffers 16 8k;
	gzip_min_length 256;
    gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    include /etc/nginx/conf.d/*.conf;
}
